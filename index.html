<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>My Streamlit App</title>
    <link
      rel="stylesheet"
      href="https://jsdelivr.net"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://jsdelivr.net"></script>
    <script>
      stlite.mount(
        {
          requirements: ["pandas", "numpy", "plotly"], // <-- Add any extra libraries here (e.g., ["pandas", "numpy"]) or leave as []
          entrypoint: "joke.py", // <-- Replace with your exact .py filename
          files: {
            "joke.py": {
              url: "joke.py", // <-- Replace both with your exact .py filename
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
